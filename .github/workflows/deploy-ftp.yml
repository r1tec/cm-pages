name: Publicar por FTP

# DESATIVADO de proposito. Este workflow subia o repositorio CRU (index.html de
# varios MB, sem otimizar e sem limpar o cache do Cloudflare), sobrescrevendo o
# resultado do ./publicar.sh a cada push na main.
# O unico caminho de publicacao e  ./publicar.sh  (ver .claude/skills/publicar).
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enviar arquivos
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            README.md
